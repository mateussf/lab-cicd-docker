# Para aplicar mudanças sem derrubar nada:  docker exec proxy httpd -k graceful
#
# Os destinos (app1, gitlab, jenkins...) são nomes de container na rede "lab",
# resolvidos pelo DNS interno do Docker.
# disablereuse=On faz o Apache resolver o nome a cada conexão: quando o pipeline recria
# um container (e ele ganha outro IP), o proxy acha o novo sem precisar ser recarregado.

# O primeiro VirtualHost é o padrão: responde quando o Host não bate com nenhum ServerName
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /usr/local/apache2/htdocs
    # Autenticação do registry (ver infra/gitlab/compose.yml, token_realm)
    ProxyPass        /jwt/auth http://gitlab/jwt/auth disablereuse=On
    ProxyPassReverse /jwt/auth http://gitlab/jwt/auth
</VirtualHost>

<VirtualHost *:80>
    ServerName app1.localhost
    ProxyPreserveHost On
    ProxyPass        / http://app1/ disablereuse=On
    ProxyPassReverse / http://app1/
</VirtualHost>

<VirtualHost *:80>
    ServerName app2.localhost
    ProxyPreserveHost On
    ProxyPass        / http://app2/ disablereuse=On
    ProxyPassReverse / http://app2/
</VirtualHost>

<VirtualHost *:80>
    ServerName gitlab.localhost
    ProxyPreserveHost On
    # Respostas grandes (git clone/push) e páginas lentas na primeira subida
    ProxyTimeout 300
    ProxyPass        / http://gitlab/ disablereuse=On
    ProxyPassReverse / http://gitlab/
</VirtualHost>

<VirtualHost *:80>
    ServerName jenkins.localhost
    ProxyPreserveHost On
    # O Jenkins valida se o proxy repassa corretamente o esquema e a porta originais
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    ProxyPass        / http://jenkins:8080/ disablereuse=On nocanon
    ProxyPassReverse / http://jenkins:8080/
    AllowEncodedSlashes NoDecode
</VirtualHost>

# Porta interna 8000: o app Python não escuta na 80, e só o proxy precisa saber disso
<VirtualHost *:80>
    ServerName python.localhost
    ProxyPreserveHost On
    ProxyPass        / http://app-python:8000/ disablereuse=On
    ProxyPassReverse / http://app-python:8000/
</VirtualHost>

<VirtualHost *:80>
    ServerName app3.localhost
    ProxyPreserveHost On
    ProxyPass        / http://app3/ disablereuse=On
    ProxyPassReverse / http://app3/
</VirtualHost>
