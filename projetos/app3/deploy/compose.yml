# Como o app roda no "servidor". Usado pelo Jenkins no estágio Deploy.
# Rollback manual: TAG=<build anterior> APP_KEY=... docker compose -f deploy/compose.yml up -d
name: app3

services:
  app3:
    image: localhost:5050/root/app3:${TAG:?informe a TAG da imagem}
    container_name: app3
    environment:
      APP_NAME: app3
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?informe a APP_KEY}
      APP_URL: http://app3.localhost
      APP_VERSAO: ${TAG}
      LOG_CHANNEL: stderr
      # Sessão e cache em arquivo: a página não depende do banco para abrir
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      # Banco fora da rede Docker (no PC: o MySQL do Windows; na empresa: o servidor do ERP)
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      DB_DATABASE: mysql
      DB_USERNAME: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - lab

networks:
  lab:
    external: true
